<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malawi Love SA ❤️ - Chat & Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#0f0f0f;color:white;overflow:hidden;height:100vh}
.header{background:linear-gradient(90deg,#ff0055,#ff4081);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px;font-weight:800}
.header .tabs{display:flex;gap:12px}
.tab{padding:8px 16px;border-radius:20px;background:rgba(255,255,255,0.2);cursor:pointer;font-weight:600}
.tab.active{background:white;color:#ff0055}
.container{display:flex;height:calc(100vh - 58px)}
.swipe-section{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative}
.card{width:340px;height:520px;background:#1e1e1e;border-radius:24px;overflow:hidden;position:absolute;box-shadow:0 20px 60px rgba(0,0,0,0.5);transition:transform 0.3s}
.card img{width:100%;height:75%;object-fit:cover}
.card-info{padding:14px}
.card-info h2{font-size:22px}
.card-info p{color:#aaa;font-size:13px;margin-top:4px}
.buttons{margin-top:560px;display:flex;gap:20px;z-index:10}
.btn{width:64px;height:64px;border-radius:50%;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.btn.no{background:white;color:#ff4444}
.btn.like{background:linear-gradient(135deg,#ff0055,#ff7a00);color:white}
.chat-section{flex:1;background:#121212;border-left:1px solid #222;display:none;flex-direction:column}
.chat-section.active{display:flex}
.matches-list{width:100%;max-width:380px;background:#121212;border-left:1px solid #222;display:none;flex-direction:column}
.matches-list.active{display:flex}
.match-item{padding:12px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #222;cursor:pointer}
.match-item:hover{background:#1a1a1a}
.match-item img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.chat-header{padding:14px 16px;background:#1a1a1a;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222}
.chat-header img{width:40px;height:40px;border-radius:50%}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#ff0055,#ff7a00)}
.msg.them{align-self:flex-start;background:#2a2a2a}
.chat-input{display:flex;padding:12px;gap:10px;background:#1a1a1a}
.chat-input input{flex:1;padding:12px 16px;border-radius:24px;border:none;background:#2a2a2a;color:white;outline:none}
.chat-input button{width:44px;height:44px;border-radius:50%;border:none;background:#ff0055;color:white;cursor:pointer;font-size:18px}
.match-popup{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column}
.match-popup.show{display:flex}
.match-popup h1{font-size:48px;background:linear-gradient(90deg,#ff0055,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
</style>
</head>
<body>
<div class="header">
<h1>Malawi Love SA ❤️</h1>
<div class="tabs">
<div class="tab active" onclick="showTab('swipe')">Discover</div>
<div class="tab" onclick="showTab('matches')">Chats <span id="chatCount"></span></div>
</div>
</div>
<div class="container">
<div class="swipe-section" id="swipeSection">
<div id="cardStack"></div>
<div class="buttons">
<button class="btn no" onclick="swipe('no')">✕</button>
<button class="btn like" onclick="swipe('like')">❤️</button>
</div>
</div>
<div class="matches-list" id="matchesList">
<h3 style="padding:16px">Your Matches & Chats</h3>
<div id="matchesContainer"></div>
</div>
<div class="chat-section" id="chatSection">
<div class="chat-header" id="chatHeader">
<img id="chatAvatar" src="">
<div style="flex:1"><b id="chatName"></b><div style="font-size:12px;color:#0f0">Online</div></div>
<button class="btn" style="width:44px;height:44px;background:#00c853;color:white" onclick="startVideoCall()">📹</button>
<button class="btn" style="width:44px;height:44px;background:#333;color:white" onclick="closeChat()">✕</button>
</div>
