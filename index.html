<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malawi Love SA ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#fff5f7}
.header{background:linear-gradient(135deg,#ff2e63,#ff6b9d);color:white;padding:22px 16px 30px;text-align:center;border-radius:0 0 25px 25px}
.header h1{font-size:28px}
.header p{opacity:.9;margin-top:6px}
.search{margin:-14px 16px 0;background:white;padding:12px;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,.1);display:flex;gap:8px}
.search input{flex:1;border:none;outline:none;font-size:15px}
.search button{background:#ff2e63;color:white;border:none;padding:8px 14px;border-radius:10px;font-weight:700}
.grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:90px}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,.08)}
.card img{width:100%;height:180px;object-fit:cover}
.card .info{padding:10px}
.card b{font-size:15px}
.card span{color:#666;font-size:13px;display:block;margin:3px 0}
.like{width:100%;background:#ff2e63;color:white;border:none;padding:9px;border-radius:10px;font-weight:700;margin-top:6px}
.like.liked{background:#222}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:14px;border-top:1px solid #eee}
.nav b{color:#ff2e63}
</style>
</head>
<body>
<div class="header">
<h1>❤️ Malawi Love SA</h1>
<p>Real people. Real love. In South Africa.</p>
<p><b id="count">6 people online</b></p>
</div>

<div class="search">
<input id="q" placeholder="Search Durban, Joburg...">
<button onclick="search()">Search</button>
</div>

<div class="grid" id="list"></div>

<div class="nav"><span><b>🏠 Home</b></span><span>💬 Chat</span><span>❤️ Likes</span><span>👤 Me</span></div>

<script>
const people=[
{name:"Chikondi, 24",city:"Durban",img:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600"},
{name:"Thandi, 26",city:"Johannesburg",img:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=600"},
{name:"Blessings, 27",city:"Cape Town",img:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600"},
{name:"Zodwa, 23",city:"Durban",img:"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600"},
{name:"Mpho, 28",city:"Pretoria",img:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600"},
{name:"Grace, 25",city:"Durban",img:"https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=600"},
];
function show(list){
document.getElementById('list').innerHTML=list.map((p,i)=>`
<div class="card">
<img src="${p.img}">
<div class="info"><b>${p.name}</b><span>📍 ${p.city} • Online now</span>
<button class="like" onclick="this.classList.add('liked');this.innerText='❤️ Liked!'">❤️ Like</button>
</div></div>`).join('');
document.getElementById('count').innerText=list.length+" people found ❤️";
}
function search(){
let v=document.getElementById('q').value.toLowerCase();
show(people.filter(p=>(p.name+p.city).toLowerCase().includes(v)));
}
show(people);
</script>
</body>
</html>
