 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malawi Love SA ❤️ - Secure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#0f0f0f;color:#fff;min-height:100vh}
.app{max-width:420px;margin:0 auto;min-height:100vh;background:#1a1a1a;position:relative;overflow:hidden}
.header{padding:16px;text-align:center;background:#000;border-bottom:1px solid #222}
.header h1{color:#ff1744;font-size:22px}
.screen{padding:20px;display:none;min-height:calc(100vh - 60px)}
.screen.active{display:block}
.card{background:#242424;border-radius:20px;padding:20px;margin-bottom:15px;border:1px solid #333}
.input{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;margin:8px 0;font-size:16px}
.btn{width:100%;padding:15px;border-radius:12px;border:0;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
.btn-red{background:#ff1744;color:#fff}
.btn-outline{background:transparent;border:1px solid #444;color:#fff}
.profile-img{width:100%;height:380px;object-fit:cover;border-radius:16px}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;background:#ff1744;margin:2px}
.actions{display:flex;gap:12px;margin-top:12px}
.act{flex:1;padding:14px;border-radius:50px;border:0;font-size:20px;cursor:pointer}
.small{font-size:13px;color:#888;text-align:center;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>Malawi Love SA ❤️ V5 SECURE</h1></div>

<!-- WELCOME -->
<div id="welcome" class="screen active">
<div class="card" style="text-align:center;margin-top:40px">
<h2 style="font-size:28px;margin-bottom:10px">Find Your Malawian Queen 🇲🇼❤️🇿🇦</h2>
<p style="color:#aaa;margin-bottom:20px">Secure. Private. For Malawians in SA only.</p>
<img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop" style="width:120px;height:120px;border-radius:50%;object-fit:cover;margin:20px auto;display:block;border:3px solid #ff1744">
<button class="btn btn-red" onclick="show('signup')">CREATE ACCOUNT - FREE</button>
<button class="btn btn-outline" onclick="show('login')">I HAVE ACCOUNT - LOGIN</button>
<p class="small">100% Free | Durban Jozi CPT | No fake profiles</p>
</div>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
<div class="card">
<h2>Create Account 🔒</h2>
<input id="s_name" class="input" placeholder="Full Name - e.g. Thandi Banda">
<div class="grid2">
<input id="s_age" class="input" type="number" placeholder="Age">
<select id="s_city" class="input"><option>Durban</option><option>Johannesburg</option><option>Cape Town</option><option>Pretoria</option><option>Other SA</option></select>
</div>
<div class="grid2">
<select id="s_gender" class="input"><option value="Female">Female</option><option value="Male">Male</option></select>
<input id="s_phone" class="input" placeholder="WhatsApp e.g. 071...">
</div>
<input id="s_pass" class="input" type="password" placeholder="Create Password (min 6)">
<input id="s_bio" class="input" placeholder="Bio - e.g. Malawian queen in Durban ❤️">
<input id="s_photo" class="input" placeholder="Photo Link (or leave blank for auto)">
<p class="small">Leave photo blank = we give you beautiful Malawian photo auto</p>
<button class="btn btn-red" onclick="doSignup()">CREATE MY ACCOUNT 🔥</button>
<button class="btn btn-outline" onclick="show('welcome')">Back</button>
</div>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
<div class="card">
<h2>Welcome Back 🔐</h2>
<input id="l_phone" class="input" placeholder="WhatsApp Number">
<input id="l_pass" class="input" type="password" placeholder="Password">
<button class="btn btn-red" onclick="doLogin()">LOGIN SECURELY</button>
<button class="btn btn-outline" onclick="show('signup')">No account? Sign up</button>
<p class="small" id="login_msg"></p>
</div>
</div>

<!-- MAIN APP -->
<div id="main" class="screen">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<span id="user_welcome"></span>
<button onclick="doLogout()" style="background:#333;color:#fff;border:0;padding:6px 12px;border-radius:20px">Logout</button>
</div>
</div>
<div class="card">
<img id="p_img" class="profile-img" src="">
<h2 id="p_name" style="margin-top:12px"></h2>
<p id="p_meta" style="color:#aaa"></p>
<p id="p_bio" style="margin-top:8px"></p>
<div class="actions">
<button class="act" style="background:#222" onclick="nextProfile()">✕</button>
<button class="act" style="background:#ff1744;color:#fff" onclick="likeProfile()">❤️</button>
<button class="act" style="background:#222" onclick="chatProfile()">💬</button>
</div>
<p class="small"><span id="p_count"></span> • Secure profiles only</p>
</div>
</div>

</div>

<script>
const AFRICAN_PHOTOS = [
"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=500&h=700&fit=crop",
"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=500&h=700&fit=crop",
"https://images.unsplash.com/photo-1534751516642-a1af1ef26a56?w=500&h=700&fit=crop",
"https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=500&h=700&fit=crop",
"https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=500&h=700&fit=crop",
"https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?w=500&h=700&fit=crop"
];
let demo = [
{name:"Thandi Banda",age:23,city:"Durban",bio:"Malawian queen in Durban ❤️ Nsima lover",img:AFRICAN_PHOTOS[0]},
{name:"Chisomo Phiri",age:22,city:"Johannesburg",bio:"In Jozi for work, looking for serious love 🇲🇼",img:AFRICAN_PHOTOS[1]},
{name:"Grace Mwale",age:24,city:"Cape Town",bio:"CPT Malawian beauty. Loyal & God fearing 🙏",img:AFRICAN_PHOTOS[2]},
{name:"Alinafe",age:21,city:"Pretoria",bio:"Student in Pretoria. Malawian pride!",img:AFRICAN_PHOTOS[3]}
];
let users = JSON.parse(localStorage.getItem('ml_users')||'[]');
let currentUser = JSON.parse(localStorage.getItem('ml_current')||'null');
let idx=0;

function show(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
if(id==='main') render();
}
function doSignup(){
let u={
name:document.getElementById('s_name').value.trim(),
age:document.getElementById('s_age').value,
city:document.getElementById('s_city').value,
gender:document.getElementById('s_gender').value,
phone:document.getElementById('s_phone').value.trim(),
pass:document.getElementById('s_pass').value,
bio:document.getElementById('s_bio').value||'Malawian in SA ❤️',
photo:document.getElementById('s_photo').value||AFRICAN_PHOTOS[Math.floor(Math.random()*AFRICAN_PHOTOS.length)]
};
if(!u.name||!u.phone||u.pass.length<6){alert('Fill name, phone & password min 6');return}
if(users.find(x=>x.phone===u.phone)){alert('Number already registered! Login');show('login');return}
users.push(u); localStorage.setItem('ml_users',JSON.stringify(users));
currentUser=u; localStorage.setItem('ml_current',JSON.stringify(u));
alert('Account created boss! Welcome '+u.name+' 🔥'); show('main');
}
function doLogin(){
let ph=document.getElementById('l_phone').value.trim();
let pa=document.getElementById('l_pass').value;
let f=users.find(x=>x.phone===ph&&x.pass===pa);
if(!f){document.getElementById('login_msg').innerText='Wrong number or password!';return}
currentUser=f; localStorage.setItem('ml_current',JSON.stringify(f)); show('main');
}
function doLogout(){localStorage.removeItem('ml_current');currentUser=null;show('welcome')}
function render(){
if(!currentUser){show('welcome');return}
document.getElementById('user_welcome').innerText='Hi, '+currentUser.name+' 👋';
let all=[...users.filter(u=>u.phone!==currentUser.phone),...demo];
if(all.length===0){all=demo}
let p=all[idx%all.length];
document.getElementById('p_img').src=p.photo||p.img;
document.getElementById('p_name').innerText=(p.name||'Unknown')+' '+(p.age?','+p.age:'');
document.getElementById('p_meta').innerText=(p.city||'')+' • '+(p.gender||'Female');
document.getElementById('p_bio').innerText=p.bio||'';
document.getElementById('p_count').innerText=(idx+1)+'/'+all.length;
}
function nextProfile(){idx++;render()}
function likeProfile(){alert('❤️ You liked! In real app she will get notification! (V6 will add chat)');idx++;render()}
function chatProfile(){let p=document.getElementById('p_name').innerText;alert('💬 Chat with '+p+' coming in V6! For now WhatsApp: Share your number');}
if(currentUser) show('main');
</script>
</body>
  </html>
