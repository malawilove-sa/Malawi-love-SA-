 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MalawiLove SA ❤️</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#ffe6ef;padding:0 0 120px}
.header{background:#ff2e63;color:#fff;text-align:center;padding:15px;font-size:22px;font-weight:bold}
.card{background:#fff;margin:12px;border-radius:15px;padding:15px;text-align:center;box-shadow:0 2px 8px #0002}
input,select{width:95%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:16px;border:0;border-radius:12px;font-size:17px;font-weight:bold;margin:6px 0;cursor:pointer}
.pink{background:#ff2e63;color:#fff}.black{background:#222;color:#fff}.orange{background:#ff9500;color:#fff}.grey{background:#eee}.red{background:#ff3b30;color:#fff}.green{background:#25D366;color:#fff}.purple{background:#9b59b6;color:#fff}
.row{display:flex;gap:8px}.row button{flex:1}
.hidden{display:none}
.topbar{display:flex;gap:6px;padding:10px;flex-wrap:wrap}.topbar button{font-size:11px;padding:10px;flex:1}
.small{font-size:13px;color:#555}
.tabBtn{flex:1;padding:16px!important;font-size:17px!important;border:2px solid #ff2e63!important}
.tabActive{background:#ff2e63;color:#fff}.tabInactive{background:#fff;color:#333}
.passwrap{position:relative;width:95%;margin:6px auto}.passwrap input{width:100%;padding-right:45px;margin:0}.eyeBtn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px!important;padding:8px!important;background:transparent!important;font-size:18px}
.safetyBox{background:#fff3cd;border:2px solid #ff9500;border-radius:12px;padding:10px;margin:10px 0;text-align:left;font-size:13px}
.genderTag{background:#ffe6ef;color:#ff2e63;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block;margin:4px}
.chatBox{height:300px;overflow-y:auto;text-align:left;background:#fff5f8;border-radius:12px;padding:10px;margin:10px 0}
.msg{max-width:75%;padding:8px 10px;border-radius:12px;margin:5px 0;font-size:14px}.msgMine{background:#ff2e63;color:#fff;margin-left:auto;text-align:right}.msgTheirs{background:#eee}
</style>
</head>
<body>
<div class="header">MalawiLove SA ❤️<div style="font-size:12px">Find Love in South Africa <span id="connStatus">● Connecting...</span></div></div>

<div id="authBox" class="card">
<h2>Welcome ❤️</h2>
<div class="safetyBox">🛡️ Safe Dating: Phone is NEVER shown.</div>
<div class="row">
<button id="tabSignup" class="tabBtn tabActive">SIGN UP</button>
<button id="tabLogin" class="tabBtn tabInactive">LOGIN</button>
</div>

<div id="signupForm">
<input id="a_name" placeholder="Your Name">
<input id="a_age" type="number" placeholder="Age">
<select id="a_gender"><option value="">Select Gender</option><option>Male</option><option>Female</option></select>
<select id="a_city"><option value="">Select City</option><option>Durban</option><option>Johannesburg</option><option>Cape Town</option><option>Pretoria</option><option>Polokwane</option><option>Blantyre</option><option>Lilongwe</option><option>Other</option></select>
<input id="a_phone" type="tel" placeholder="Phone Number">
<input id="a_about" placeholder="About you">
<div class="passwrap"><input id="a_pass" type="password" placeholder="Create Password"><button type="button" class="eyeBtn" id="eye1">👁️</button></div>
<input id="a_secret" type="text" placeholder="Secret Word - e.g. Mango">
<label style="display:block;text-align:left;font-size:14px"><input id="a_18" type="checkbox" style="width:auto"> I am 18+</label>
<label style="display:block;text-align:left"><b>📸 Photo REQUIRED:</b><input id="a_photo" type="file" accept="image/*"></label>
<img id="a_preview" class="hidden" style="margin:auto">
<button class="pink" id="btnSignup">CREATE ACCOUNT ❤️</button>
<button class="black" id="btnGoLogin">Already have account? LOGIN HERE ➡️</button>
</div>

<div id="loginForm" class="hidden">
<input id="l_phone" type="tel" placeholder="Your Phone Number">
<div class="passwrap"><input id="l_pass" type="password" placeholder="Your Password"><button type="button" class="eyeBtn" id="eye2">👁️</button></div>
<button class="black" id="btnLogin">LOGIN ➡️</button>
<button class="orange" id="btnForgot">🔑 FORGOT PASSWORD?</button>
<button class="grey" id="btnGoSignup">Don't have account? Go to SIGN UP</button>
</div>

<div id="forgotForm" class="hidden">
<h3>🔑 Forgot Password</h3>
<input id="f_phone" type="tel" placeholder="Your Phone Number">
<input id="f_secret" type="text" placeholder="Your Secret Word">
<input id="f_newpass" type="password" placeholder="New Password">
<button class="green" id="btnReset">RESET PASSWORD ✅</button>
<button class="grey" id="btnBackLogin">⬅️ Back to LOGIN</button>
</div>
</div>

<div id="mainBox" class="hidden">
<div class="topbar">
<button class="grey" id="navHome">🏠 Home</button>
<button class="grey" id="navProfile">👤 Profile</button>
<button class="grey" id="navLikes">❤️ Likes</button>
<button class="purple" id="navMatches">💘 Matches</button>
<button class="pink" id="navChats">💬 Chats</button>
<button class="red" id="navLogout">Logout</button>
</div>
<div id="homeArea">
<div class="card"><p class="small" id="peopleCount">Loading...</p>
<h3>🔍 Search</h3>
<select id="s_city"><option value="">All Cities</option><option>Durban</option><option>Johannesburg</option><option>Cape Town</option><option>Pretoria</option><option>Polokwane</option><option>Blantyre</option><option>Lilongwe</option><option>Other</option></select>
<select id="s_gender"><option value="">All Genders</option><option>Male</option><option>Female</option></select>
<div class="row"><input id="s_min" type="number" placeholder="Min Age"><input id="s_max" type="number" placeholder="Max Age"></div>
<button class="pink" id="btnSearch">SEARCH</button>
<button class="grey" id="btnClear">CLEAR SEARCH</button>
</div>
<div id="list"></div>
</div>
<div id="myProfileBox" class="card hidden"><h2>👤 My Profile</h2><div id="myProfileView"></div><button class="pink" id="btnEdit">✏️ EDIT MY PROFILE</button><button class="red" id="btnDelete">🗑️ DELETE MY ACCOUNT</button></div>
<div id="editBox" class="card hidden"><h2>✏️ Edit</h2><input id="e_name" placeholder="Name"><input id="e_age" type="number" placeholder="Age"><select id="e_gender"><option>Male</option><option>Female</option></select><select id="e_city"><option>Durban</option><option>Johannesburg</option><option>Cape Town</option><option>Pretoria</option><option>Polokwane</option><option>Blantyre</option><option>Lilongwe</option><option>Other</option></select><input id="e_about" placeholder="About you"><label>Change Photo:<input id="e_photo" type="file" accept="image/*"></label><img id="e_preview" style="width:120px;height:120px;border-radius:50%;object-fit:cover"><button class="green" id="btnSaveEdit">✅ SAVE</button><button class="grey" id="btnCancelEdit">Cancel</button></div>
<div id="likesBox" class="card hidden"><h2>❤️ Who Liked You</h2><div id="likesList"></div></div>
<div id="matchesBox" class="card hidden"><h2>💘 Matches</h2><div id="matchesList"></div></div>
<div id="chatsBox" class="card hidden"><h2>💬 My Chats</h2><div id="chatsList"></div><button class="grey" id="btnBackHome1">⬅️ Back</button></div>
<div id="chatBox" class="card hidden"><h2 id="chatTitle">💬 Chat</h2><div id="chatMessages" class="chatBox"></div><div class="row"><input id="chatInput" placeholder="Type message..."><button class="pink" id="btnSend">Send</button></div><button class="grey" id="btnBackChats">⬅️ Back</button></div>
</div>

<div id="matchModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,46,99,0.95);z-index:1000;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;box-sizing:border-box"><h1 style="color:#fff">IT'S A MATCH! 💘</h1><img id="matchPhoto" style="width:150px;height:150px;border-radius:50%;border:4px solid #fff"><h2 id="matchName" style="color:#fff"></h2><button class="black" id="btnMatchChat" style="max-width:300px">💬 SEND MESSAGE NOW</button><button class="grey" id="btnMatchClose" style="max-width:300px">Keep Swiping ➡️</button></div>
<div id="photoModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;align-items:center;justify-content:center;flex-direction:column"><img id="bigPhoto" style="max-width:95%;max-height:85%;border-radius:15px"><p style="color:#fff">Tap anywhere to close ✖️</p></div>

<script>
// --- FIREBASE - if it fails, app still works offline ---
let db=null;
try{
  const firebaseConfig={apiKey:"AIzaSyAcNs2UdpGCZYXSquuwMk2ze3odWd36oP0",authDomain:"malawi-love-sa.firebaseapp.com",databaseURL:"https://malawi-love-sa-default-rtdb.firebaseio.com",projectId:"malawi-love-sa",storageBucket:"malawi-love-sa.firebasestorage.app",messagingSenderId:"44621212737",appId:"1:44621212737:web:15daa656f79505d3eaeac0"};
  firebase.initializeApp(firebaseConfig); db=firebase.database();
  document.getElementById('connStatus').textContent='● ONLINE';
}catch(e){ document.getElementById('connStatus').textContent='● OFFLINE - Still works'; }

const DEFAULT_PHOTO="https://via.placeholder.com/150";
function normPhone(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('27')&&d.length===11)d='0'+d.slice(2);return d;}
function isValidUser(u){return u&&u.name&&u.age&&u.city&&u.phone;}
let users=JSON.parse(localStorage.getItem('ml_users')||'[]');
let me=JSON.parse(localStorage.getItem('ml_me')||'null');
let blocks=JSON.parse(localStorage.getItem('ml_blocks')||'[]');
let likes=JSON.parse(localStorage.getItem('ml_likes')||'[]');
let filter={city:'',gender:'',min:'',max:''};
let photoData='';let editPhotoData='';let currentChatId=null;let currentChatOtherId=null;let lastMatchUser=null;

function toggleEye(id){let inp=document.getElementById(id);inp.type=(inp.type==='password'?'text':'password');}
function openPhoto(src){document.getElementById('bigPhoto').src=src||DEFAULT_PHOTO;document.getElementById('photoModal').style.display='flex';}
document.getElementById('photoModal').onclick=function(){this.style.display='none';};

function showTab(w){
  document.getElementById('forgotForm').classList.add('hidden');
  if(w==='signup'){document.getElementById('signupForm').classList.remove('hidden');document.getElementById('loginForm').classList.add('hidden');document.getElementById('tabSignup').className='tabBtn tabActive';document.getElementById('tabLogin').className='tabBtn tabInactive';}
  else{document.getElementById('signupForm').classList.add('hidden');document.getElementById('loginForm').classList.remove('hidden');document.getElementById('tabSignup').className='tabBtn tabInactive';document.getElementById('tabLogin').className='tabBtn tabActive';}
  window.scrollTo(0,0);
}
function save(){localStorage.setItem('ml_users',JSON.stringify(users));localStorage.setItem('ml_me',JSON.stringify(me));localStorage.setItem('ml_blocks',JSON.stringify(blocks));localStorage.setItem('ml_likes',JSON.stringify(likes));}
function pushUser(u){if(db&&isValidUser(u)){try{db.ref('users/'+u.id).set(u);}catch(e){}}}

// --- FIX A + B: ALL BUTTONS WIRED HERE, NOT onclick ---
document.getElementById('tabSignup').addEventListener('click',()=>showTab('signup'));
document.getElementById('tabLogin').addEventListener('click',()=>showTab('login'));
document.getElementById('btnGoLogin').addEventListener('click',()=>showTab('login'));
document.getElementById('btnGoSignup').addEventListener('click',()=>showTab('signup'));
document.getElementById('btnForgot').addEventListener('click',()=>{document.getElementById('signupForm').classList.add('hidden');document.getElementById('loginForm').classList.add('hidden');document.getElementById('forgotForm').classList.remove('hidden');});
document.getElementById('btnBackLogin').addEventListener('click',()=>{document.getElementById('forgotForm').classList.add('hidden');document.getElementById('loginForm').classList.remove('hidden');});
document.getElementById('eye1').addEventListener('click',()=>toggleEye('a_pass'));
document.getElementById('eye2').addEventListener('click',()=>toggleEye('l_pass'));

document.getElementById('a_photo').addEventListener('change',e=>{let r=new FileReader();r.onload=()=>{photoData=r.result;let p=document.getElementById('a_preview');p.src=photoData;p.classList.remove('hidden')};r.readAsDataURL(e.target.files[0])});
document.getElementById('e_photo').addEventListener('change',e=>{let r=new FileReader();r.onload=()=>{editPhotoData=r.result;document.getElementById('e_preview').src=editPhotoData};r.readAsDataURL(e.target.files[0])});

document.getElementById('btnSignup').addEventListener('click',()=>{
  let name=document.getElementById('a_name').value.trim();
  let age=document.getElementById('a_age').value;
  let gender=document.getElementById('a_gender').value;
  let city=document.getElementById('a_city').value;
  let phone=normPhone(document.getElementById('a_phone').value);
  let about=document.getElementById('a_about').value.trim()||"No bio yet ❤️";
  let pass=document.getElementById('a_pass').value;
  let secret=document.getElementById('a_secret').value.trim();
  if(!name) return alert('Please enter Your Name');
  if(!age) return alert('Please enter Age');
  if(!gender) return alert('Please select Gender');
  if(!city) return alert('Please select City');
  if(!phone) return alert('Please enter Phone');
  if(!pass) return alert('Please create Password');
  if(!secret) return alert('Please enter Secret Word');
  if(!document.getElementById('a_18').checked) return alert('Tick I am 18+');
  if(!photoData) return alert('Photo REQUIRED 📸');
  if(users.find(u=>normPhone(u.phone)===phone)) return alert('This phone already has account. Tap LOGIN.');
  let u={id:Date.now().toString(),name,age,gender,city,phone,about,pass,secret,photo:photoData,online:true,lastSeen:Date.now()};
  users.push(u);me=u;save();pushUser(u);showMain();alert('Welcome '+name+' ❤️');
});

document.getElementById('btnLogin').addEventListener('click',()=>{
  let phone=normPhone(document.getElementById('l_phone').value);
  let pass=document.getElementById('l_pass').value;
  if(!phone||!pass) return alert('Enter Phone + Password');
  let u=users.find(x=>normPhone(x.phone)===phone&&x.pass===pass);
  if(!u) return alert('Wrong phone or password. If new, go to SIGN UP and create account.');
  me=u;save();showMain();alert('Welcome back '+me.name+' ❤️');
});

document.getElementById('btnReset').addEventListener('click',()=>{
  let phone=normPhone(document.getElementById('f_phone').value);
  let secret=document.getElementById('f_secret').value.trim();
  let np=document.getElementById('f_newpass').value;
  let u=users.find(x=>normPhone(x.phone)===phone);
  if(!u||u.secret!==secret) return alert('Wrong phone or secret word');
  u.pass=np;if(me&&me.id===u.id)me=u;save();pushUser(u);alert('Password reset! Login now');document.getElementById('forgotForm').classList.add('hidden');document.getElementById('loginForm').classList.remove('hidden');
});

// NAV
document.getElementById('navHome').addEventListener('click',showHome);
document.getElementById('navProfile').addEventListener('click',showMyProfile);
document.getElementById('navLikes').addEventListener('click',showLikes);
document.getElementById('navMatches').addEventListener('click',showMatches);
document.getElementById('navChats').addEventListener('click',showChats);
document.getElementById('navLogout').addEventListener('click',()=>{me=null;localStorage.removeItem('ml_me');location.reload();});
document.getElementById('btnBackHome1').addEventListener('click',showHome);
document.getElementById('btnBackChats').addEventListener('click',()=>{if(db&&currentChatId)db.ref('chats/'+currentChatId).off();showChats();});
document.getElementById('btnSearch').addEventListener('click',()=>{filter={city:document.getElementById('s_city').value,gender:document.getElementById('s_gender').value,min:document.getElementById('s_min').value,max:document.getElementById('s_max').value};render();});
document.getElementById('btnClear').addEventListener('click',()=>{filter={city:'',gender:'',min:'',max:''};document.getElementById('s_city').value='';document.getElementById('s_gender').value='';document.getElementById('s_min').value='';document.getElementById('s_max').value='';render();});
document.getElementById('btnEdit').addEventListener('click',openEdit);
document.getElementById('btnDelete').addEventListener('click',()=>{if(!confirm('Delete account?'))return;users=users.filter(u=>u.id!==me.id);if(db)db.ref('users/'+me.id).remove();me=null;save();location.reload();});
document.getElementById('btnSaveEdit').addEventListener('click',()=>{me.name=document.getElementById('e_name').value;me.age=document.getElementById('e_age').value;me.gender=document.getElementById('e_gender').value;me.city=document.getElementById('e_city').value;me.about=document.getElementById('e_about').value;if(editPhotoData)me.photo=editPhotoData;let i=users.findIndex(u=>u.id===me.id);if(i>=0)users[i]=me;save();pushUser(me);showMyProfile();alert('Saved ✅');});
document.getElementById('btnCancelEdit').addEventListener('click',showMyProfile);
document.getElementById('btnSend').addEventListener('click',sendMsg);
document.getElementById('btnMatchChat').addEventListener('click',()=>{document.getElementById('matchModal').style.display='none';if(lastMatchUser)openChat(lastMatchUser.id);});
document.getElementById('btnMatchClose').addEventListener('click',()=>{document.getElementById('matchModal').style.display='none';});
document.getElementById('matchModal').addEventListener('click',()=>{document.getElementById('matchModal').style.display='none';});

function showMain(){document.getElementById('authBox').classList.add('hidden');document.getElementById('mainBox').classList.remove('hidden');showHome();}
function showHome(){hideAll();document.getElementById('homeArea').classList.remove('hidden');render();}
function hideAll(){['homeArea','myProfileBox','editBox','likesBox','matchesBox','chatsBox','chatBox'].forEach(id=>document.getElementById(id).classList.add('hidden'));}
function render(){
  let list=document.getElementById('list');document.getElementById('peopleCount').textContent=users.length+' people on MalawiLove ❤️';
  let shown=users.filter(u=>u.id!==me.id&&!blocks.includes(u.id)&&isValidUser(u));
  if(filter.city) shown=shown.filter(u=>u.city===filter.city);
  if(filter.gender) shown=shown.filter(u=>u.gender===filter.gender);
  if(filter.min) shown=shown.filter(u=>Number(u.age)>=Number(filter.min));
  if(filter.max) shown=shown.filter(u=>Number(u.age)<=Number(filter.max));
  if(!shown.length){list.innerHTML='<div class="card">No people found. Try CLEAR SEARCH ❤️</div>';return;}
  list.innerHTML=shown.map(u=>`<div class="card"><img src="${u.photo||DEFAULT_PHOTO}"><h3>${u.name}, ${u.age}</h3><span class="genderTag">${u.gender||''}</span> <span class="genderTag">${u.city}</span><p class="small">${u.about||''}</p><div class="row"><button class="pink" data-like="${u.id}">❤️ LIKE</button><button class="black" data-chat="${u.id}">💬 CHAT</button></div></div>`).join('');
  list.querySelectorAll('[data-like]').forEach(b=>b.addEventListener('click',()=>likeUser(b.dataset.like)));
  list.querySelectorAll('[data-chat]').forEach(b=>b.addEventListener('click',()=>openChat(b.dataset.chat)));
  list.querySelectorAll('img').forEach((im,i)=>im.addEventListener('click',()=>openPhoto(shown[i].photo)));
}
function showMyProfile(){hideAll();document.getElementById('myProfileBox').classList.remove('hidden');document.getElementById('myProfileView').innerHTML=`<img src="${me.photo}" style="width:150px;height:150px;border-radius:50%;object-fit:cover"><h3>${me.name}, ${me.age}</h3><span class="genderTag">Gender: ${me.gender|
