 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malawi Love SA ❤️ - Chat & Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#0f0f0f;color:white;overflow:hidden;height:100vh}
.header{background:linear-gradient(90deg,#ff0055,#ff4081);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px;font-weight:800}
.header .tabs{display:flex;gap:12px}
.tab{padding:8px 16px;border-radius:20px;background:rgba(255,255,255,0.2);cursor:pointer;font-weight:600}
.tab.active{background:white;color:#ff0055}
.container{display:flex;height:calc(100vh - 58px)}
.swipe-section{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative}
.card{width:340px;height:520px;background:#1e1e1e;border-radius:24px;overflow:hidden;position:absolute;box-shadow:0 20px 60px rgba(0,0,0,0.5);transition:transform 0.3s}
.card img{width:100%;height:75%;object-fit:cover}
.card-info{padding:14px}
.card-info h2{font-size:22px}
.card-info p{color:#aaa;font-size:13px;margin-top:4px}
.buttons{margin-top:560px;display:flex;gap:20px;z-index:10}
.btn{width:64px;height:64px;border-radius:50%;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.btn.no{background:white;color:#ff4444}
.btn.like{background:linear-gradient(135deg,#ff0055,#ff7a00);color:white}
.chat-section{flex:1;background:#121212;border-left:1px solid #222;display:none;flex-direction:column}
.chat-section.active{display:flex}
.matches-list{width:100%;max-width:380px;background:#121212;border-left:1px solid #222;display:none;flex-direction:column}
.matches-list.active{display:flex}
.match-item{padding:12px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #222;cursor:pointer}
.match-item:hover{background:#1a1a1a}
.match-item img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.chat-header{padding:14px 16px;background:#1a1a1a;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222}
.chat-header img{width:40px;height:40px;border-radius:50%}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#ff0055,#ff7a00)}
.msg.them{align-self:flex-start;background:#2a2a2a}
.chat-input{display:flex;padding:12px;gap:10px;background:#1a1a1a}
.chat-input input{flex:1;padding:12px 16px;border-radius:24px;border:none;background:#2a2a2a;color:white;outline:none}
.chat-input button{width:44px;height:44px;border-radius:50%;border:none;background:#ff0055;color:white;cursor:pointer;font-size:18px}
.match-popup{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column}
.match-popup.show{display:flex}
.match-popup h1{font-size:48px;background:linear-gradient(90deg,#ff0055,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
</style>
</head>
<body>
<div class="header">
<h1>Malawi Love SA ❤️</h1>
<div class="tabs">
<div class="tab active" onclick="showTab('swipe')">Discover</div>
<div class="tab" onclick="showTab('matches')">Chats <span id="chatCount"></span></div>
</div>
</div>
<div class="container">
<div class="swipe-section" id="swipeSection">
<div id="cardStack"></div>
<div class="buttons">
<button class="btn no" onclick="swipe('no')">✕</button>
<button class="btn like" onclick="swipe('like')">❤️</button>
</div>
</div>
<div class="matches-list" id="matchesList">
<h3 style="padding:16px">Your Matches & Chats</h3>
<div id="matchesContainer"></div>
</div>
<div class="chat-section" id="chatSection">
<div class="chat-header" id="chatHeader">
<img id="chatAvatar" src="">
<div style="flex:1"><b id="chatName"></b><div style="font-size:12px;color:#0f0">Online</div></div>
<button class="btn" style="width:44px;height:44px;background:#00c853;color:white" onclick="startVideoCall()">📹</button>
<button class="btn" style="width:44px;height:44px;background:#333;color:white" onclick="closeChat()">✕</button>
</div>
<div class="chat-messages" id="chatMessages"></div>
<div class="chat-input">
<input id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">➤</button>
</div>
</div>
</div>
<div class="match-popup" id="matchPopup">
<h1>It's a MATCH! 🎉</h1>
<p style="margin:12px">You and <b id="matchName"></b> liked each other</p>
<img id="matchImg" style="width:120px;height:120px;border-radius:50%;margin:16px;object-fit:cover">
<div style="display:flex;gap:12px;margin-top:16px">
<button style="padding:12px 24px;border-radius:24px;border:none;background:white;color:#ff0055;font-weight:700;cursor:pointer" onclick="closeMatchPopup()">Keep Swiping</button>
<button style="padding:12px 24px;border-radius:24px;border:none;background:linear-gradient(90deg,#ff0055,#ff7a00);color:white;font-weight:700;cursor:pointer" onclick="openChatFromMatch()">Send Message 💬</button>
</div>
</div>
<script>
const profiles=[
{name:"Thandi",age:24,city:"Durban",img:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400",bio:"Malawian queen in SA ❤️ Loves amapiano"},
{name:"Chisomo",age:22,city:"Johannesburg",img:"https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?w=400",bio:"Student, looking for serious love"},
{name:"Grace",age:26,city:"Cape Town",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400",bio:"Chef 👩‍🍳 Love cooking nsima"},
{name:"Tionge",age:23,city:"Pretoria",img:"https://images.unsplash.com/photo-1534751516642-a1af1ef26a56?w=400",bio:"Gym & Jesus ❤️"},
{name:"Mphatso",age:25,city:"Durban",img:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400",bio:"Hair stylist, single mom, loyal"}
];
let currentIndex=0;
let matches=JSON.parse(localStorage.getItem('mw_matches')||'[]');
let chats=JSON.parse(localStorage.getItem('mw_chats')||'{}');
let activeChat=null;
let lastMatched=null;
function renderCard(){
const stack=document.getElementById('cardStack');
stack.innerHTML='';
if(currentIndex>=profiles.length){
stack.innerHTML='<h2 style=color:#777>No more profiles nearby<br><small style=font-size:14px>Check back later!</small></h2>';
return;
}
const p=profiles[currentIndex];
const div=document.createElement('div');
div.className='card';
div.innerHTML=`<img src="${p.img}"><div class="card-info"><h2>${p.name}, ${p.age}</h2><p>📍 ${p.city} • ${p.bio}</p></div>`;
stack.appendChild(div);
}
function swipe(type){
if(currentIndex>=profiles.length) return;
const p=profiles[currentIndex];
if(type==='like'){
if(Math.random()>0.3){
if(!matches.find(m=>m.name===p.name)){
matches.push(p);
chats[p.name]=chats[p.name]||[{from:'them',text:`Hi! Thanks for liking me 😊 I'm ${p.name}!`,time:Date.now()}];
localStorage.setItem('mw_matches',JSON.stringify(matches));
localStorage.setItem('mw_chats',JSON.stringify(chats));
showMatch(p);
}
}
}
currentIndex++;
renderCard();
updateMatchesUI();
}
function showMatch(p){
lastMatched=p;
document.getElementById('matchName').textContent=p.name;
document.getElementById('matchImg').src=p.img;
document.getElementById('matchPopup').classList.add('show');
}
function closeMatchPopup(){document.getElementById('matchPopup').classList.remove('show');}
function openChatFromMatch(){closeMatchPopup();showTab('matches');openChat(lastMatched);}
function showTab(t){
document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
if(t==='swipe'){
document.querySelectorAll('.tab')[0].classList.add('active');
document.getElementById('swipeSection').style.display='flex';
document.getElementById('matchesList').classList.remove('active');
document.getElementById('chatSection').classList.remove('active');
}else{
document.querySelectorAll('.tab')[1].classList.add('active');
document.getElementById('swipeSection').style.display='none';
document.getElementById('matchesList').classList.add('active');
document.getElementById('chatSection').classList.remove('active');
updateMatchesUI();
}
}
function updateMatchesUI(){
const cont=document.getElementById('matchesContainer');
cont.innerHTML='';
if(matches.length===0){cont.innerHTML='<p style=color:#666;padding:20px>Like some profiles to start chatting ❤️</p>';return;}
matches.forEach(m=>{
const lastMsg=chats[m.name]?chats[m.name][chats[m.name].length-1]?.text:'Say hi! 👋':'';
const div=document.createElement('div');
div.className='match-item';
div.onclick=()=>openChat(m);
div.innerHTML=`<img src="${m.img}"><div style=flex:1><b>${m.name}</b><div style=font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px>${lastMsg}</div></div><div style=color:#ff0055>💬</div>`;
cont.appendChild(div);
});
document.getElementById('chatCount').textContent=matches.length?`(${matches.length})`:'';
}
function openChat(p){
activeChat=p;
document.getElementById('matchesList').classList.remove('active');
document.getElementById('chatSection').classList.add('active');
document.getElementById('chatName').textContent=p.name;
document.getElementById('chatAvatar').src=p.img;
renderMessages();
}
function closeChat(){
document.getElementById('chatSection').classList.remove('active');
document.getElementById('matchesList').classList.add('active');
activeChat=null;
}
function renderMessages(){
const box=document.getElementById('chatMessages');
box.innerHTML='';
const list=chats[activeChat.name]||[];
list.forEach(m=>{
const d=document.createElement('div');
d.className='msg '+(m.from==='me'?'me':'them');
d.textContent=m.text;
box.appendChild(d);
});
box.scrollTop=box.scrollHeight;
}
function sendMsg(){
const input=document.getElementById('msgInput');
const text=input.value.trim();
if(!text||!activeChat) return;
chats[activeChat.name]=chats[activeChat.name]||[];
chats[activeChat.name].push({from:'me',text,time:Date.now()});
localStorage.setItem('mw_chats',JSON.stringify(chats));
input.value='';
renderMessages();
updateMatchesUI();
setTimeout(()=>{
const replies=["Haha that's sweet 😊","I stay in "+activeChat.city+" wena?","When can we video call? 📹","You are cute 😍","Malawi to SA love is real ❤️"];
const r=replies[Math.floor(Math.random()*replies.length)];
chats[activeChat.name].push({from:'them',text:r,time:Date.now()});
localStorage.setItem('mw_chats',JSON.stringify(chats));
if(activeChat) renderMessages();
updateMatchesUI();
},1200);
}
function startVideoCall(){
if(!activeChat) return;
window.open('https://meet.jit.si/MalawiLoveSA_'+activeChat.name,'_blank');
}
renderCard();
updateMatchesUI();
</script>
</body>
</html>
