<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malawi Love SA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#ffe6ef;margin:0;padding:10px;text-align:center}
.card{background:#fff;max-width:420px;margin:auto;padding:18px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1);text-align:left}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box;font-size:15px}
button{border:none;font-weight:bold;cursor:pointer}
.big{background:#ff2e7e;color:#fff}
.green{background:#25D366;color:#fff}
.tab{display:inline-block;padding:8px 14px;margin:4px;background:#eee;border-radius:20px;cursor:pointer}
.tab.active{background:#ff2e7e;color:#fff}
.person{background:#fff;padding:12px;margin:8px 0;border-radius:12px;text-align:left}
.person img{width:100%;height:220px;object-fit:cover;border-radius:12px}
#myPic{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #ff2e7e;display:none}
</style>
</head>
<body>
<h1 style="color:#ff2e7e;">Malawi Love SA </h1>
<p id="status">Real App - Loading...</p>

<div id="authBox" class="card">
<h2 style="text-align:center;">Login / Sign Up</h2>
<input id="a_name" placeholder="Your Name (for Sign Up)">
<input id="a_phone" placeholder="Phone - e.g 068...">
<input id="a_pass" type="password" placeholder="Password">
<input id="a_age" type="number" placeholder="Age - e.g 29">
<input id="a_city" placeholder="City - e.g Durban (for Sign Up)">
<input id="a_interest" placeholder="Interests - e.g Singing (for Sign Up)">
<label><b>Profile Picture </b> - Choose from gallery</label>
<input type="file" id="p_photo_file" accept="image/*">
<img id="picPreview" style="width:90px;height:90px;border-radius:50%;object-fit:cover;display:none;margin:10px auto;">
<button class="big" onclick="doLogin()">LOGIN</button>
<button class="green" onclick="doSignup()">SIGN UP - CREATE MY PROFILE ❤️</button>
<p style="font-size:13px;color:#666;text-align:center;">Sign Up = creates your real profile in Supabase. Login = uses Phone + Password</p>
</div>

<div id="appBox" style="display:none;" class="card">
<div style="text-align:center;">
<img id="myPic"><br>
<b id="myNameShow"></b><br>
<label style="background:#ff2e7e;color:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;display:inline-block;margin-top:8px;">📸 Change Profile Picture
<input type="file" id="changePicInput" accept="image/*" style="display:none;">
</label>
<p id="picStatus" style="color:green;font-size:13px;"></p>
<button onclick="doLogout()" style="background:#eee;">Logout</button>
</div>
<div style="text-align:center;margin-top:10px;">
<span class="tab active" id="tabBrowse" onclick="showTab('browse')">Browse ❤️</span>
<span class="tab" id="tabChat" onclick="showTab('chat')">Chat 💬</span>
<span class="tab" id="tabMatch" onclick="showTab('match')">Matches ⭐</span>
</div>
<div id="browseTab"><div id="list"></div></div>
<div id="chatTab" style="display:none;">
<div id="chatList"></div>
<div id="msg">Select a person to chat</div>
<input id="msgInput" placeholder="Type message...">
<button class="big" onclick="sendMsg()">Send ❤️</button>
</div>
<div id="matchTab" style="display:none;"><div id="matchList"></div></div>
</div>

<script>
const SUPABASE_URL = "https://fzkavixubxtrlptplymq.supabase.co";
const SUPABASE_KEY = "sb_publishable_SnXO5On70bbqUONRFAX4EA_0JBAw_Sc";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let people=[], currentUser=null, chattingWith=null, liked=[];

async function fileToBase64(file){
  return new Promise(res=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(file); });
}
document.getElementById('p_photo_file').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  const b=await fileToBase64(f);
  const p=document.getElementById('picPreview'); p.src=b; p.style.display='block';
});
document.getElementById('changePicInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f||!currentUser) return;
  document.getElementById('picStatus').innerText="Uploading...";
  const b=await fileToBase64(f);
  document.getElementById('myPic').src=b; document.getElementById('myPic').style.display='inline-block';
  await supabase.from('profiles').update({photo:b, profile_pic:b}).eq('phone', currentUser.phone);
  document.getElementById('picStatus').innerText="✅ Picture Changed & Saved!";
  loadPeople();
});
async function doSignup(){
  const name=document.getElementById('a_name').value.trim();
  const phone=document.getElementById('a_phone').value.trim();
  const pass=document.getElementById('a_pass').value.trim();
  const age=parseInt(document.getElementById('a_age').value);
  const city=document.getElementById('a_city').value.trim();
  const interests=document.getElementById('a_interest').value.trim();
  if(!name||!phone||!pass) return alert("Fill Name, Phone, Password");
  let photoLink="";
  const picFile=document.getElementById('p_photo_file').files[0];
  if(picFile) photoLink=await fileToBase64(picFile);
  document.getElementById('status').innerText="Creating profile...";
  const {data,error}=await supabase.from('profiles').insert([{name,phone,password:pass,age,city,interests,photo:photoLink,profile_pic:photoLink}]).select();
  if(error) return alert("Signup Error: "+error.message);
  alert("Welcome "+name+"! Now LOGIN");
  showApp(data[0]);
}
async function doLogin(){
  const phone=document.getElementById('a_phone').value.trim();
  const pass=document.getElementById('a_pass').value.trim();
  const {data,error}=await supabase.from('profiles').select('*').eq('phone',phone).eq('password',pass).single();
  if(error||!data) return alert("Wrong Phone or Password");
  showApp(data);
}
function showApp(user){
  currentUser=user; localStorage.setItem('myPhone',user.phone);
  document.getElementById('authBox').style.display='none';
  document.getElementById('appBox').style.display='block';
  document.getElementById('myNameShow').innerText=user.name+" • "+user.city;
  const pic=user.photo||user.profile_pic||"";
  if(pic){ const m=document.getElementById('myPic'); m.src=pic; m.style.display='inline-block'; }
  document.getElementById('status').innerText="Welcome "+user.name+" ❤️";
  loadPeople();
}
function doLogout(){ localStorage.removeItem('myPhone'); location.reload(); }
async function loadPeople(){
  const {data}=await supabase.from('profiles').select('*').order('id',{ascending:false});
  people=data||[];
  const others=people.filter(p=>p.phone!==currentUser.phone);
  document.getElementById('status').innerText="Found "+others.length+" REAL people";
  document.getElementById('list').innerHTML=others.map(p=>`
    <div class="person">
    ${p.photo||p.profile_pic?`<img src="${p.photo||p.profile_pic}">`:`<div style="height:120px;background:#ffe6ef;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;">❤️</div>`}
    <h3>${p.name}, ${p.age||''} • ${p.city||''}</h3><p>${p.interests||''}</p>
    <button class="big" onclick="likePerson('${p.phone}')">❤️ LIKE</button>
    <button class="green" onclick="startChat('${p.phone}')">💬 Chat</button>
    </div>`).join('')||"<p>No people yet - invite a friend!</p>";
  document.getElementById('matchList').innerHTML=others.filter(p=>liked.includes(p.phone)).map(p=>`<div class="person"><b>${p.name}</b> - ${p.city}</div>`).join('')||"<p>No matches yet</p>";
}
function likePerson(phone){ if(!liked.includes(phone)) liked.push(phone); alert("❤️ Liked!"); loadPeople(); }
function showTab(t){
  document.getElementById('browseTab').style.display=t==='browse'?'block':'none';
  document.getElementById('chatTab').style.display=t==='chat'?'block':'none';
  document.getElementById('matchTab').style.display=t==='match'?'block':'none';
}
function startChat(phone){ chattingWith=phone; showTab('chat'); const p=people.find(x=>x.phone===phone); document.getElementById('msg').innerText="Chatting with "+(p?p.name:phone); }
async function sendMsg(){
  const txt=document.getElementById('msgInput').value.trim(); if(!txt||!chattingWith) return alert("Select a person first");
  await supabase.from('messages').insert([{from_phone:currentUser.phone,to_phone:chattingWith,message:txt}]);
  document.getElementById('msgInput').value=""; alert("Sent!"); 
}
</script>
</body>
</html>
