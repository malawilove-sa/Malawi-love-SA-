 <!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malawi Love - Real App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#fff5f5;margin:0;padding:15px}
h1{color:#e11d48;text-align:center}
.card{background:white;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #ddd}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:13px;background:#e11d48;color:white;border:none;border-radius:10px;font-weight:bold;margin-top:8px}
img{width:100%;border-radius:12px;height:260px;object-fit:cover}
.tabs{display:flex;gap:8px} .tabs button{background:#ffe4e6;color:#e11d48}
</style>
</head>
<body>
<h1>❤️ Malawi Love 🇲🇼</h1>
<p id="status" style="text-align:center">Connecting to your REAL Supabase...</p>

<div class="tabs">
<button onclick="show('signup')">Sign Up</button>
<button onclick="show('browse')">Browse People</button>
</div>

<div id="signup" class="card">
<h3>Create Profile - Real Table</h3>
<input id="full_name" placeholder="Full Name - e.g. Spahu">
<input id="phone" placeholder="Phone - e.g. 071...">
<input id="email" placeholder="Email">
<input id="age" type="number" placeholder="Age - e.g. 20">
<input id="city" placeholder="City - e.g. Durban">
<input id="interests" placeholder="Interests - e.g. Music">
<input id="photo_url" placeholder="Photo URL - paste image link">
<button onclick="signup()">Create My Profile ❤️</button>
</div>

<div id="browse" class="card" style="display:none">
<h3>Real People in Durban</h3>
<button onclick="loadProfiles()">Refresh People</button>
<div id="list"></div>
</div>

<script>
const SUPABASE_URL = "https://fzkavixubxtrlptplymq.supabase.co";
const SUPABASE_KEY = "sb_publishable_SnXO5On70bbqUONRFAX4EA_0JBAw_Sc";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function show(id){
  document.getElementById('signup').style.display = id==='signup'?'block':'none';
  document.getElementById('browse').style.display = id==='browse'?'block':'none';
  if(id==='browse') loadProfiles();
}

async function signup(){
  const data = {
    full_name: document.getElementById('full_name').value,
    phone: document.getElementById('phone').value,
    email: document.getElementById('email').value,
    age: parseInt(document.getElementById('age').value),
    city: document.getElementById('city').value,
    interests: document.getElementById('interests').value,
    photo_url: document.getElementById('photo_url').value || 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600',
    role: 'user'
  };
  if(!data.full_name || !data.phone){ alert('Please fill Name and Phone'); return; }
  const { error } = await supabaseClient.from('profiles').insert([data]);
  if(error){ alert('Error: '+error.message); }
  else{ alert('Welcome '+data.full_name+'! Your REAL profile is saved!'); show('browse'); }
}

async function loadProfiles(){
  document.getElementById('status').innerText = 'Loading real people...';
  const { data, error } = await supabaseClient.from('profiles').select('*').order('created_at',{ascending:false});
  if(error){ document.getElementById('status').innerText = 'Error: '+error.message; return; }
  document.getElementById('status').innerText = 'Found '+data.length+' real people ✅';
  document.getElementById('list').innerHTML = data.map(p=>`
    <div class="card">
      <img src="${p.photo_url || 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600'}">
      <h3>${p.full_name}, ${p.age || ''}</h3>
      <p>📍 ${p.city || ''} • 🎵 ${p.interests || ''}</p>
      <p>📞 ${p.phone || ''}</p>
      <button onclick="alert('You liked ${p.full_name}! ❤️')">❤️ Like ${p.full_name}</button>
    </div>`).join('');
}
loadProfiles();
</script>
</body>
</html>
