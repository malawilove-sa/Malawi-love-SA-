<title>MalawiLove SA - Find Love in South Africa</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#FFF5F7;color:#111}
.top{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;box-shadow:0 1px 8px #0001;z-index:10}
.logo{font-weight:900;font-size:22px;color:#E91E63;white-space:nowrap}.logo span{color:#111}

.tab-on{background:#E91E63;color:#fff}.tab-off{background:#F3F4F6;color:#333}
input,select,textarea{width:100%;padding:13px;border:1px solid #E5E7EB;border-radius:10px;margin:6px 0;font-size:15px}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}
.pink{background:#E91E63;color:#fff}.grey{background:#F3F4F6;color:#333}
.eye-wrap{display:flex;gap:6px;align-items:center}.eye-wrap input{flex:1}.eye{width:48px;padding:13px 0;border:1px solid #E5E7EB;border-radius:10px;background:#F3F4F6;cursor:pointer;margin:6px 0}
.small{font-size:12px;color:#6B7280;text-align:center;margin-top:10px;line-height:1.5}
.link{color:#E91E63;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.person{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px #0001}
.person img{width:100%;height:180px;object-fit:cover;background:#FCE7F3}.person div{padding:10px}
.hidden{display:none}.row{display:flex;gap:8px}.row button{flex:1}
.topbtn{padding:8px 14px;border-radius:20px;border:0;font-weight:700;cursor:pointer;background:#F3F4F6}
</style></head>

<div id="signupForm">

<div class="row"><select id="a_looking"><option value="">Looking for *</option><option>Woman</option><option>Man</option></select><select id="a_city"><option>Durban</option><option>Johannesburg</option><option>Cape Town</option><option>Pretoria</option><option>Blantyre</option><option>Lilongwe</option><option>Other</option></select></div>

<button class="btn pink" onclick="doSignup()">Create My Account ❤️</button>
<p class="small">By joining you agree you are 18+ and will be respectful.<br>Already have account? <span class="link" onclick="showLogin()">Log In here</span></p>
