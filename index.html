  <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malawi Love SA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:linear-gradient(180deg,#ffe0ec,#fff5f8);color:#333;padding:16px;margin:0;min-height:100vh}
h2{text-align:center;color:#d81b60}
input{background:white;padding:14px;border:1px solid #ffc1d6;border-radius:14px;width:100%;box-sizing:border-box;margin:6px 0;font-size:15px}
button{background:linear-gradient(90deg,#e91e63,#ff4081);color:white;padding:14px;border:none;border-radius:14px;width:100%;margin:6px 0;font-weight:bold;font-size:15px;box-shadow:0 4px 12px rgba(233,30,99,.3)}
button:active{transform:scale(.98)}
.card{background:white;padding:15px;border-radius:20px;margin:14px 0;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.card img{width:100%;height:240px;object-fit:cover;border-radius:16px}
.chatbox{background:#fff;padding:10px;border-radius:14px;height:320px;overflow-y:auto;border:1px solid #ffe0ec}
.tab{display:flex;gap:6px}
.tab button{flex:1;background:white;color:#e91e63;padding:12px;box-shadow:none}
.tab button.active{background:#e91e63;color:white}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:50px}
.eye-btn{position:absolute;right:5px;top:6px;width:40px !important;background:none !important;color:#333 !important;font-size:20px;padding:8px !important;box-shadow:none !important}
.small-btn{background:white !important;color:#e91e63 !important;box-shadow:none !important;border:1px solid #ffc1d6 !important}
.danger-btn{background:#ff1744 !important}
#photoPreview{width:100%;height:200px;object-fit:cover;border-radius:14px;display:none;margin:6px 0}
</style>
</head>
<body>
<h2>Malawi Love SA ❤️</h2>
<p id="status" style="text-align:center">Ready</p>

<div id="auth">
<h2>Sign Up / Login</h2>
<input id="name" placeholder="Full Name * Required">
<input id="phone" placeholder="Phone e.g. 0781234567">
<div class="pass-wrap">
<input id="pass" type="password" placeholder="Password">
<button type="button" class="eye-btn" onclick="togglePass()">👁️</button>
</div>
<input id="age" type="number" placeholder="Age">
<input id="city" placeholder="City e.g. Durban / Lilongwe">
<input id="interests" placeholder="Interests">
<label style="font-size:13px;color:#e91e63"><b>📸 Upload Photo Directly:</b></label>
<input type="file" id="photoFile" accept="image/*" onchange="handlePhotoUpload(event)">
<img id="photoPreview">
<input id="photo" placeholder="Photo Link - Or upload above, link will appear here">
<input id="email" placeholder="Email - REAL email for Forgot Password">
<button onclick="doSignup()">SIGN UP</button>
<button onclick="doLogin()">LOGIN</button>
<button class="small-btn" onclick="forgotPassword()">🔑 FORGOT PASSWORD?</button>
</div>

<div id="home" style="display:none">
<div class="tab">
<button id="tabPeople" class="active" onclick="showTab('people')">People</button>
<button id="tabLiked" onclick="showTab('liked')">Liked By Me</button>
<button id="tabMatches" onclick="showTab('matches')">Matches</button>
</div>
<p style="text-align:center"><b id="tabTitle">People near you</b></p>
<div id="people"></div>
<button onclick="doLogout()">LOGOUT</button>
<button onclick="showEditProfile()">EDIT MY PROFILE</button>
</div>

<div id="editpage" style="display:none">
<h2>Edit My Profile</h2>
<input id="edit-name" placeholder="Full Name">
<input id="edit-age" type="number" placeholder="Age">
<input id="edit-city" placeholder="City - Durban / Lilongwe / Blantyre / Joburg / Cape Town">
<input id="edit-interests" placeholder="Interests">
<label style="font-size:13px;color:#e91e63"><b>📸 Change Photo:</b></label>
<input type="file" id="editPhotoFile" accept="image/*" onchange="handleEditPhotoUpload(event)">
<img id="editPhotoPreview" style="width:100%;height:200px;object-fit:cover;border-radius:14px;display:none">
<input id="edit-photo" placeholder="Photo Link">
<button onclick="saveProfile()">SAVE CHANGES</button>
<button onclick="backHome()">BACK</button>
<button class="danger-btn" onclick="deleteProfile()">🗑️ DELETE MY PROFILE FOREVER</button>
</div>

<div id="chatpage" style="display:none">
<h2 id="chattitle">Chat</h2>
<div class="chatbox" id="messages"></div>
<div style="display:flex;gap:5px"><input id="msginput" placeholder="Type message..."><button onclick="sendMsg()">SEND</button></div>
<button onclick="backHome()">BACK</button>
</div>

<script>
const SUPABASE_URL = "https://fzkavixubxtrlptplymq.supabase.co";
const SUPABASE_KEY = "sb_publishable_SnXO5On70bbqUONRFAX4EA_0JBAw_Sc";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let myPhone = "";
let currentTab = "people";
let chatWith = "";

function togglePass(){ let p=document.getElementById("pass"); p.type=p.type==="password"?"text":"password"; }
function getEmail(){
  let real = document.getElementById("email").value.trim();
  if(real && real.includes("@")) return real;
  return document.getElementById("phone").value.trim() + "@gmail.com";
}
function cleanName(n){ if(!n || n==="null" || n==="NULL") return "No Name"; return n; }
function cleanPhoto(p){ if(!p || p==="null" || p.trim()==="") return "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"; return p; }

// PHOTO UPLOAD - Direct from phone
function handlePhotoUpload(e){
  let file = e.target.files[0]; if(!file) return;
  if(file.size > 2000000){ alert("Photo too big! Please pick a smaller photo under 2MB"); return; }
  let reader = new FileReader();
  reader.onload = function(ev){
    document.getElementById("photo").value = ev.target.result;
    let prev = document.getElementById("photoPreview"); prev.src = ev.target.result; prev.style.display="block";
    alert("Photo ready! ✅ Now click SIGN UP");
  };
  reader.readAsDataURL(file);
}
function handleEditPhotoUpload(e){
  let file = e.target.files[0]; if(!file) return;
  if(file.size > 2000000){ alert("Photo too big! Pick smaller photo"); return; }
  let reader = new FileReader();
  reader.onload = function(ev){
    document.getElementById("edit-photo").value = ev.target.result;
    let prev = document.getElementById("editPhotoPreview"); prev.src = ev.target.result; prev.style.display="block";
    alert("New photo ready! Click SAVE CHANGES");
  };
  reader.readAsDataURL(file);
}

// FORGOT PASSWORD
async function forgotPassword(){
  let email = prompt("Enter your REAL email you used to Sign Up:");
  if(!email || !email.includes("@")){ alert("Please enter a valid email"); return; }
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
  if(error){ alert("Error: " + error.message + "\n\nTip: If you signed up with Phone only, your email is Phone@gmail.com - but you can't receive mail there. Next time use a REAL email!"); return; }
  alert("Check your email inbox! We sent a reset link to " + email + " ❤️");
}

// DELETE PROFILE
async function deleteProfile(){
  if(!confirm("Are you SURE? This will delete your profile, likes and chats FOREVER!")) return;
  if(!confirm("Last chance! Delete forever?")) return;
  document.getElementById("status").innerText="Deleting...";
  await supabaseClient.from("likes").delete().or(`liker_phone.eq.${myPhone},liked_phone.eq.${myPhone}`);
  await supabaseClient.from("messages").delete().or(`sender_phone.eq.${myPhone},receiver_phone.eq.${myPhone}`);
  let { error } = await supabaseClient.from("profiles").delete().eq("phone", myPhone);
  if(error){ alert("Delete Error: " + error.message); return; }
  await supabaseClient.auth.signOut();
  localStorage.removeItem("my_phone");
  document.getElementById("editpage").style.display="none";
  document.getElementById("home").style.display="none";
  document.getElementById("auth").style.display="block";
  document.getElementById("status").innerText="Profile Deleted";
  alert("Your profile is deleted. Bye! 😢");
}

async function doSignup(){
  let nm=document.getElementById("name").value.trim();
  let ph=document.getElementById("phone").value.trim();
  let pw=document.getElementById("pass").value;
  if(!nm){ alert("Please enter your Full Name!"); return; }
  if(!ph){ alert("Please enter your Phone!"); return; }
  if(!pw || pw.length<6){ alert("Password must be at least 6 characters!"); return; }
  document.getElementById("status").innerText="Creating profile...";
  let email=getEmail();
  const { data, error } = await supabaseClient.auth.signUp({ email, password: pw });
  if(error){ alert("Sign Up Error: " + error.message); document.getElementById("status").innerText="Ready"; return; }
  let user_id=data.user?data.user.id:null;
  const { error:e2 } = await supabaseClient.from("profiles").insert([{ id:user_id, phone:ph, full_name:nm, age:document.getElementById("age").value, city:document.getElementById("city").value, interests:document.getElementById("interests").value, photo:document.getElementById("photo").value }]);
  if(e2){ alert("Profile error: " + e2.message); document.getElementById("status").innerText="Ready"; return; }
  localStorage.setItem("my_phone", ph);
  document.getElementById("status").innerText="Welcome "+nm+" ❤️";
  alert("SUCCESS! Welcome "+nm); showHome();
}

async function doLogin(){
  document.getElementById("status").innerText="Logging in...";
  let email=getEmail();
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password:document.getElementById("pass").value });
  if(error){ alert("Login Error: " + error.message); document.getElementById("status").innerText="Ready"; return; }
  localStorage.setItem("my_phone", document.getElementById("phone").value.trim());
  document.getElementById("status").innerText="Welcome back! ❤️";
  alert("Welcome back!"); showHome();
}

async function showTab(tab){
  currentTab=tab;
  document.getElementById("tabPeople").className=tab=="people"?"active":"";
  document.getElementById("tabLiked").className=tab=="liked"?"active":"";
  document.getElementById("tabMatches").className=tab=="matches"?"active":"";
  document.getElementById("tabTitle").innerText=tab=="people"?"People near you":tab=="liked"?"People you liked":"People who liked you";
  showHomeList();
}
async function showHome(){
  document.getElementById("auth").style.display="none";
  document.getElementById("chatpage").style.display="none";
  document.getElementById("editpage").style.display="none";
  document.getElementById("home").style.display="block";
  myPhone=localStorage.getItem("my_phone")||document.getElementById("phone").value.trim();
  showHomeList();
}
async function showHomeList(){
  let { data } = await supabaseClient.from("profiles").select("*");
  let { data:likes } = await supabaseClient.from("likes").select("*").eq("liker_phone", myPhone);
  let { data:likedMe } = await supabaseClient.from("likes").select("*").eq("liked_phone", myPhone);
  let likedList=likes?likes.map(l=>l.liked_phone):[];
  let likedMeList=likedMe?likedMe.map(l=>l.liker_phone):[];
  let list=data||[];
  if(currentTab=="liked") list=list.filter(p=>likedList.includes(p.phone));
  if(currentTab=="matches") list=list.filter(p=>likedList.includes(p.phone)&&likedMeList.includes(p.phone));
  let html="";
  list.forEach(p=>{
    if(p.phone==myPhone) return;
    let isLiked=likedList.includes(p.phone);
    let isMatch=likedList.includes(p.phone)&&likedMeList.includes(p.phone);
    let displayName=cleanName(p.full_name);
    let displayPhoto=cleanPhoto(p.photo);
    let displayCity=p.city||"Unknown City";
    let displayAge=p.age||"?";
    html+=`<div class="card"><img src="${displayPhoto}"><div style="background:#ffe0ec;padding:4px;border-radius:12px">${isMatch?'❤️ IT\'S A MATCH!':''}</div><h3>${displayName} - ${displayAge}</h3><p>📍 ${displayCity}</p><p>${p.interests||''}</p><button onclick="doLike('${p.phone}','${displayName}')">❤️ ${isLiked?'LIKED':'LIKE'}</button><button onclick="openChat('${p.phone}','${displayName}')">💬 CHAT</button></div>`;
  });
  document.getElementById("people").innerHTML=html||"<p style='text-align:center'>No people here yet</p>";
}
async function doLike(phone,name){
  let { data:existing } = await supabaseClient.from("likes").select("*").eq("liker_phone",myPhone).eq("liked_phone",phone);
  if(existing&&existing.length>0){ alert("You already liked "+name); return; }
  let { error } = await supabaseClient.from("likes").insert([{ liker_phone:myPhone, liked_phone:phone }]);
  if(error){ alert("Like Error: "+error.message); return; }
  let { data:back } = await supabaseClient.from("likes").select("*").eq("liker_phone",phone).eq("liked_phone",myPhone);
  if(back&&back.length>0) alert("You liked "+name+" - IT'S A MATCH! ❤️");
  else alert("You liked "+name);
  showHomeList();
}
function openChat(phone,name){
  chatWith=phone;
  document.getElementById("home").style.display="none";
  document.getElementById("chatpage").style.display="block";
  document.getElementById("chattitle").innerText="Chat with "+name;
  loadMessages();
}
function backHome(){
  document.getElementById("chatpage").style.display="none";
  document.getElementById("editpage").style.display="none";
  document.getElementById("home").style.display="block";
  showHomeList();
}
async function loadMessages(){
  let { data } = await supabaseClient.from("messages").select("*").or(`and(sender_phone.eq.${myPhone},receiver_phone.eq.${chatWith}),and(sender_phone.eq.${chatWith},receiver_phone.eq.${myPhone})`).order("created_at",{ascending:true});
  let html="";
  (data||[]).forEach(m=>{ html+=`<div style="text-align:${m.sender_phone==myPhone?'right':'left'}"><span style="background:${m.sender_phone==myPhone?'#e91e63':'white'};color:${m.sender_phone==myPhone?'white':'black'};padding:6px;border-radius:10px;display:inline-block">${m.message}</span></div>`; });
  document.getElementById("messages").innerHTML=html;
  document.getElementById("messages").scrollTop=document.getElementById("messages").scrollHeight;
}
async function sendMsg(){
  let txt=document.getElementById("msginput").value.trim(); if(!txt) return;
  let { error } = await supabaseClient.from("messages").insert([{ sender_phone:myPhone, receiver_phone:chatWith, message:txt }]);
  if(error){ alert("Chat Error: "+error.message); return; }
  document.getElementById("msginput").value=""; loadMessages();
}
async function showEditProfile(){
  document.getElementById("home").style.display="none";
  document.getElementById("editpage").style.display="block";
  let { data } = await supabaseClient.from("profiles").select("*").eq("phone",myPhone).single();
  if(data){
    document.getElementById("edit-name").value=data.full_name||"";
    document.getElementById("edit-age").value=data.age||"";
    document.getElementById("edit-city").value=data.city||"";
    document.getElementById("edit-interests").value=data.interests||"";
    document.getElementById("edit-photo").value=data.photo||"";
    if(data.photo){ let prev=document.getElementById("editPhotoPreview"); prev.src=data.photo; prev.style.display="block"; }
  }
}
async function saveProfile(){
  let newName=document.getElementById("edit-name").value.trim();
  if(!newName){ alert("Name cannot be empty!"); return; }
  let { error } = await supabaseClient.from("profiles").update({ full_name:newName, age:document.getElementById("edit-age").value, city:document.getElementById("edit-city").value, interests:document.getElementById("edit-interests").value, photo:document.getElementById("edit-photo").value }).eq("phone",myPhone);
  if(error){ alert("Error: "+error.message); return; }
  alert("Profile Updated! ❤️"); backHome();
}
async function doLogout(){
  await supabaseClient.auth.signOut();
  document.getElementById("auth").style.display="block";
  document.getElementById("home").style.display="none";
  document.getElementById("chatpage").style.display="none";
  document.getElementById("editpage").style.display="none";
  document.getElementById("status").innerText="Ready";
  localStorage.removeItem("my_phone");
}
</script>
</body>
</html>
