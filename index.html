     <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malawi Love SA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#ffeef5;font-family:sans-serif;padding:15px}
.card{background:white;padding:20px;border-radius:20px}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin-top:10px}
.login{background:#ff2e88;color:white}
.signup{background:#00c853;color:white}
</style>
</head>
<body>
<h2 style="text-align:center">Malawi Love SA ❤️</h2>
<p id="status" style="text-align:center">Connecting...</p>
<div class="card">
<h2 style="text-align:center">Login / Sign Up</h2>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone - e.g 0994655709">
<input id="pass" type="password" placeholder="Password">
<input id="age" type="number" placeholder="Age">
<input id="city" placeholder="City - e.g Durban">
<input id="interests" placeholder="Interests - e.g Singing">
<button class="login" onclick="doLogin()">LOGIN</button>
<button class="signup" onclick="doSignup()">SIGN UP - CREATE MY PROFILE ❤️</button>
</div>
<p id="msg" style="text-align:center;font-weight:bold"></p>
<script>
const SUPABASE_URL = "https://fzkavixubxtrlptplymq.supabase.co";
const SUPABASE_KEY = "sb_publishable_SnXO5On70bbqUONRFAX4EA_0JBAw_Sc";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
document.getElementById('status').innerText = "Ready ✅ - Tap Sign Up";
function getEmail(){ return document.getElementById('phone').value.trim() + "@malawilove.app"; }
async function doSignup(){
  document.getElementById('msg').innerText = "Creating profile... please wait";
  const email = getEmail();
  const password = document.getElementById('pass').value;
  const {data, error} = await supabaseClient.auth.signUp({email: email, password: password});
  if(error){ document.getElementById('msg').innerText = "Error: " + error.message; alert("Error: " + error.message); return; }
  const user = data.user;
  const {error: err2} = await supabaseClient.from('profiles').insert([{id: user.id, full_name: document.getElementById('name').value, phone: document.getElementById('phone').value, age: parseInt(document.getElementById('age').value), city: document.getElementById('city').value, interests: document.getElementById('interests').value}]);
  if(err2){ document.getElementById('msg').innerText = "Profile Error: " + err2.message; alert("Profile Error: " + err2.message); return; }
  document.getElementById('msg').innerText = "SUCCESS! Profile Created ❤️";
  alert("SUCCESS! Your profile is created!");
}
async function doLogin(){
  const {data, error} = await supabaseClient.auth.signInWithPassword({email: getEmail(), password: document.getElementById('pass').value});
  if(error){ alert("Login Error: " + error.message); } else { alert("Welcome back! Logged in ❤️"); }
}
</script>
</body>
</html>
